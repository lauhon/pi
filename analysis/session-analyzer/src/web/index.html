<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi attention</title>
<style>
/* Six colour roles: text, muted, blue (links/focus), amber (decision), red (failure), green (done). Greys are surfaces. */
:root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#e6edf3; --dim:#8b949e; --blue:#58a6ff; --amber:#e3b341; --red:#f85149; --green:#3fb950; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:18px/1.35 -apple-system,"Segoe UI",sans-serif; overflow:hidden; }
button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; font-size:16px; cursor:pointer; }
button:hover { border-color:var(--dim); }
button:focus-visible, a:focus-visible, .srow:focus-visible, .drow:focus-visible { outline:2px solid var(--blue); outline-offset:1px; }
button.link { background:none; border:none; padding:0; color:var(--blue); }
button.link:hover { text-decoration:underline; }
a { color:var(--blue); }
.dim { color:var(--dim); }
.amber { color:var(--amber); } .red { color:var(--red); } .green { color:var(--green); }

#app { display:grid; grid-template-columns:440px 1fr; grid-template-rows:48px 1fr; height:100vh; gap:1px; background:var(--line); }
#app > * { background:var(--bg); min-height:0; min-width:0; }
#top { grid-column:1 / 3; display:flex; align-items:center; gap:22px; padding:0 16px; font-size:16px; color:var(--dim); white-space:nowrap; overflow:hidden; }
#top h1 { margin:0; font-size:20px; color:var(--fg); font-weight:600; }
#top .sp { flex:1; }
#top .new { color:var(--amber); font-weight:600; }

#rail { padding:10px 8px; display:flex; flex-direction:column; overflow:hidden; }
#slist { overflow-y:auto; flex:1; }
.srow { height:76px; padding:6px 10px; border-radius:6px; cursor:pointer; border-left:3px solid transparent; display:flex; flex-direction:column; justify-content:center; gap:1px; overflow:hidden; }
.srow:hover { background:var(--panel); }
.srow.focus { border-left-color:var(--blue); }
.srow.sel { background:var(--panel); }
.srow .l1 { display:flex; justify-content:space-between; gap:10px; font-size:18px; font-weight:600; }
.srow .l1 > span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .l2, .srow .l3 { display:flex; justify-content:space-between; gap:10px; font-size:16px; color:var(--dim); white-space:nowrap; }
.srow .st.waiting { color:var(--amber); font-weight:600; }
.srow .st.working { color:var(--fg); }
.subs { margin:0 0 6px 20px; }
.sub { height:44px; padding:3px 10px; cursor:pointer; border-radius:6px; font-size:16px; display:flex; flex-direction:column; justify-content:center; overflow:hidden; color:var(--dim); }
.sub:hover { background:var(--panel); }
.sub .l1 { display:flex; justify-content:space-between; gap:10px; color:var(--fg); }
.sub .l1 > span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.grp { font-size:16px; color:var(--dim); padding:12px 10px 4px; }
#empty { padding:20px 10px; color:var(--dim); font-size:18px; }

#decide { padding:0 28px; overflow-y:auto; }
#decide h2 { margin:0; height:64px; display:flex; align-items:center; justify-content:space-between; font-size:24px; font-weight:600; }
#decide h2 small { font-size:16px; color:var(--dim); font-weight:400; }
#none { color:var(--dim); font-size:22px; padding:36px 0; }
.drow { display:flex; align-items:center; gap:18px; border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:8px; padding:12px 16px; margin-bottom:10px; background:var(--panel); cursor:pointer; }
.drow .body { flex:1; min-width:0; }
.drow .head { font-size:22px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drow .why { font-size:16px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drow .meta { font-size:16px; color:var(--dim); margin-top:2px; }
.drow .tag { color:var(--amber); font-weight:600; }
.drow.fresh { animation:fade 1.2s ease-out 1; }
@keyframes fade { from { border-color:var(--amber); background:#e3b34126; } }
.newlabel { color:var(--amber); font-weight:600; font-size:14px; border:1px solid var(--amber); border-radius:4px; padding:0 5px; margin-right:8px; vertical-align:2px; }
@media (prefers-reduced-motion: reduce) { .drow.fresh { animation:none; } * { scroll-behavior:auto !important; transition:none !important; } }

.drow .act { white-space:nowrap; }
.drow.handled { border-left-color:var(--line); background:none; }
.drow.handled .head { font-size:18px; font-weight:400; color:var(--dim); }
.hist { margin:18px 0 28px; }
.hist > button { margin-bottom:10px; }
.tab { color:var(--dim); } .state { font-size:16px; }

#memwarn { margin:0 0 12px; font-size:18px; color:var(--amber); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#memwarn:empty { display:none; }
#memwarn button.link { color:var(--amber); font-size:inherit; text-align:left; }

/* Inspect panel */
#panel { position:fixed; top:49px; right:0; bottom:0; width:min(720px, calc(100vw - 460px)); background:var(--bg); border-left:1px solid var(--line); display:none; flex-direction:column; z-index:10; font-size:14px; box-shadow:-8px 0 24px #0008; }
#panel.open { display:flex; }
#panelbar { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); font-size:16px; }
#panelbar b { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; }
#panelbody { flex:1; overflow-y:auto; padding:12px 16px 24px; }
#panelbody h3 { margin:16px 0 6px; font-size:14px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
.dec { font-size:22px; font-weight:600; line-height:1.3; margin:4px 0 8px; }
.sect { border-top:1px solid var(--line); margin-top:14px; padding-top:10px; }
.sect h3 { margin-top:0 !important; }
.claim { color:var(--dim); font-size:14px; }
.row2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
textarea, input[type=text] { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; font-size:14px; }
textarea { min-height:90px; resize:vertical; }
label.f { display:block; color:var(--dim); font-size:14px; margin:8px 0 2px; }
.out { margin:6px 0 0; padding:4px 10px; border-left:2px solid var(--line); font-size:14px; color:var(--dim); }
.out b { color:var(--fg); font-weight:600; }
button.pri { border-color:var(--blue); color:var(--blue); }
button.sel { border-color:var(--green); color:var(--green); }
button:disabled { opacity:.5; cursor:default; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.tabs button { font-size:14px; padding:4px 10px; }
.tabs button.on { border-color:var(--blue); color:var(--blue); }
.mrow { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:8px; background:var(--panel); cursor:pointer; }
.mrow .t { font-size:16px; font-weight:600; }
.mrow .m { font-size:14px; color:var(--dim); }
.mrow .s { font-size:14px; }
.mrow .risk { color:var(--amber); font-size:14px; }
.mrow.open { cursor:default; }
.chip { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:0 8px; margin:4px 6px 0 0; font-size:14px; color:var(--blue); background:none; font-family:inherit; cursor:pointer; text-decoration:none; }
span.chip { color:var(--dim); cursor:default; }
.toast { position:sticky; top:0; background:var(--panel); border:1px solid var(--green); border-radius:6px; padding:6px 10px; margin-bottom:8px; font-size:14px; display:flex; gap:10px; align-items:center; }
.kv { display:grid; grid-template-columns:110px 1fr; gap:2px 10px; font-size:14px; margin:6px 0; }
.kv span:nth-child(odd) { color:var(--dim); }
.pick .sess { display:block; width:100%; text-align:left; margin-top:4px; font-size:14px; }
.pick .sess.on { border-color:var(--blue); color:var(--blue); }
.seg.g { cursor:pointer; }
.seg.sub2 { padding-left:22px; color:var(--dim); }
.nums { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.num { background:var(--panel); border-radius:8px; padding:6px 10px; }
.num .v { font-size:20px; font-weight:700; } .num .k { color:var(--dim); font-size:14px; }
.box { position:relative; background:var(--panel); border-radius:8px; padding:6px; margin-top:10px; }
#chartbox { height:280px; } #treebox { height:300px; }
svg { width:100%; height:100%; display:block; }
#head { position:absolute; top:8px; left:12px; right:12px; display:flex; flex-wrap:wrap; gap:4px 16px; justify-content:space-between; color:var(--dim); pointer-events:none; z-index:1; font-size:14px; }
#tip { position:fixed; pointer-events:none; background:#000d; border:1px solid var(--line); border-radius:6px; padding:8px 10px; max-width:420px; font-size:14px; display:none; z-index:20; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
.seg { display:flex; gap:6px; padding:4px 0; border-bottom:1px solid var(--line); font-size:14px; align-items:center; }
.seg .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .seg .v { color:var(--dim); font-variant-numeric:tabular-nums; }
#legend { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:14px; color:var(--dim); margin-top:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>Attention</h1>
    <span id="refreshed"></span>
    <span id="focus"></span>
    <span class="sp"></span>
    <span id="unread"></span>
    <button class="link" id="memctl">Work memory</button>
  </div>
  <div id="rail"><div id="slist"></div></div>
  <div id="decide"><h2><span>Decisions</span><small id="dcount"></small></h2><div id="memwarn"></div><div id="dlist"></div></div>
</div>
<div id="panel" role="dialog" aria-label="Inspect">
  <div id="panelbar"><b id="paneltitle"></b><button id="copylink">Copy link</button><button id="close">Close</button></div>
  <div id="panelbody"></div>
</div>
<div id="tip"></div>
<script>
"use strict";
const COLORS = {
  "system.preamble":"#1f6feb","system.tools":"#388bfd","system.rules":"#58a6ff","system.docs":"#79c0ff","system.addendum":"#a5d6ff",
  "system.project_context":"#2dd4bf","system.skills":"#14b8a6","system.cwd":"#99f6e4","system.other":"#5eead4",
  "tool_description":"#a371f7","user":"#3fb950","assistant.text":"#f0883e","assistant.thinking":"#e3b341","assistant.tool_call":"#f778ba",
  "tool_result":"#f85149","custom_message":"#56d4dd","bash_execution":"#b08968","compaction_summary":"#8b949e","branch_summary":"#c9d1d9"
};
const SOURCES = Object.keys(COLORS);
const FIXED = s => s.startsWith("system.") || s === "tool_description";
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const fmtK = n => n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e3 ? (n/1e3).toFixed(n >= 1e5 ? 0 : 1)+"k" : String(Math.round(n));
const fmtCost = c => "$" + c.toFixed(c >= 10 ? 1 : 2);
const ago = ms => { const s = Math.max(0, (Date.now()-ms)/1000); return s < 90 ? Math.round(s)+"s" : s < 5400 ? Math.round(s/60)+"m" : s < 172800 ? Math.round(s/3600)+"h" : Math.round(s/86400)+"d"; };
const fmtAge = d => d < 1 ? (d * 24 < 1 ? Math.max(1, Math.round(d * 1440)) + "m" : Math.round(d * 24) + "h") : d.toFixed(1) + "d";
const clock = ms => new Date(ms).toTimeString().slice(0, 8);

const TOKEN = (document.querySelector('meta[name="attention-token"]') || {}).content || "";
const STATUS = { working:"working", waiting:"waiting for you", idle:"idle" };
const KIND = { scope:"Scope", schema:"DB schema", other:"Assumption" };
const state = {
  att:null, okAt:0, failed:false, open:new Set(), earlier:false, moreDecisions:false,
  ref:null, series:null, sel:null, detail:null, title:"", panel:null, openSources:new Set(), history:false, shown:new Set(), wide:null, sessErr:null, reqMissing:null,
  steers:JSON.parse(localStorage.getItem("attention.steers") || "{}"), steerState:{}, drafts:{}, msg:{},
  mem:{ q:"", state:"relevant", repo:"", items:[], version:"", counts:null, readAt:0, skipped:0, expanded:null, undo:null, pick:null, msg:"", summary:null, repos:[], session:null },
  seen:new Set(JSON.parse(localStorage.getItem("attention.seen") || "[]")),
};

async function api(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }
async function post(url, body) {
  const r = await fetch(url, { method:"POST", headers:{ "content-type":"application/json", "x-attention-token":TOKEN }, body:JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ── seen / unread: stable catch key, kept in localStorage, set only by opening or marking ──
function saveSeen() { localStorage.setItem("attention.seen", JSON.stringify([...state.seen].slice(-1000))); }
function markSeen(keys) { for (const k of keys) state.seen.add(k); saveSeen(); renderHeader(); renderDecisions(); }
const isNew = c => c.actionable && !state.seen.has(c.key);

async function refresh() {
  try {
    state.att = await api("/api/attention?hours=24");
    state.okAt = Date.now(); state.failed = false;
  } catch (e) { state.failed = true; renderHeader(); throw e; }
  renderHeader(); renderRail(); renderDecisions();
}

function renderHeader() {
  const a = state.att;
  $("refreshed").innerHTML = state.failed ? `<span class="amber">refresh failed, last ok ${state.okAt ? clock(state.okAt) : "never"}</span>` : "refreshed " + (state.okAt ? clock(state.okAt) : "…");
  if (!a) return;
  const f = a.sessions.find(s => s.id === a.focused);
  $("focus").textContent = !a.focusKnown ? "focus unknown" : f ? "focus: " + f.project + (f.name ? " · " + f.name : "") : "focus: no listed session";
  const n = a.catches.filter(isNew).length;
  $("unread").innerHTML = n ? `<span class="new">${n} new</span> <button class="link" id="markall">mark all seen</button>` : "";
  const b = $("markall"); if (b) b.onclick = () => markSeen(a.catches.filter(isNew).map(c => c.key));
}

// ── sessions rail ──
function sessionRow(s) {
  const d = document.createElement("div");
  const focus = state.att.focused === s.id;
  d.className = "srow" + (focus ? " focus" : "") + (state.ref === s.ref ? " sel" : "");
  d.tabIndex = 0;
  const subs = s.subs.length ? `<button class="link" data-t="1">${state.open.has(s.id) ? "▾" : "▸"} ${s.subs.length} sub-run${s.subs.length === 1 ? "" : "s"}</button>` : "<span></span>";
  const open = s.actionable ? ` · <span class="amber">${s.actionable} open</span>` : "";
  d.innerHTML = `<div class="l1"><span>${esc(s.project)}${s.name ? ` <span class="dim" style="font-weight:400">· ${esc(clip(s.name, 40))}</span>` : ""}</span><span>${fmtCost(s.cost)}</span></div>
    <div class="l2"><span><span class="st ${s.status}">${STATUS[s.status]}</span>${open}${focus ? " · in focus" : ""}</span><span>started ${fmtAge(s.ageDays)} ago</span></div>
    <div class="l3"><span>updated ${ago(s.mtime)} ago${s.memoryCount ? ` · <button class="link" data-mem="1" title="open work-memory items linking this session">${s.memoryCount} memory</button>` : ""}</span>${subs}</div>`;
  const go = ev => {
    if (ev.target.dataset && ev.target.dataset.t) { state.open.has(s.id) ? state.open.delete(s.id) : state.open.add(s.id); renderRail(); return; }
    if (ev.target.dataset && ev.target.dataset.mem) { nav(memUrl({ state:"open", session:s.ref })); return; }
    nav(sessionUrl(s.ref));
  };
  d.onclick = go;
  d.onkeydown = ev => { if (ev.key === "Enter" && ev.target === d) go(ev); };
  return d;
}

function subRow(s) {
  const d = document.createElement("div");
  d.className = "sub"; d.tabIndex = 0;
  d.innerHTML = `<div class="l1"><span>${esc(s.name || "sub-run")}</span><span>${fmtCost(s.cost)}</span></div><div>${STATUS[s.status]} · updated ${ago(s.mtime)} ago</div>`;
  d.onclick = () => nav(sessionUrl(s.ref));
  d.onkeydown = ev => { if (ev.key === "Enter") nav(sessionUrl(s.ref)); };
  return d;
}

function renderRail() {
  const el = $("slist"), keep = el.scrollTop;
  el.innerHTML = "";
  const list = state.att.sessions;
  if (!list.length) { el.innerHTML = '<div id="empty">No session changed in the last 24 hours.</div>'; return; }
  const add = s => {
    el.appendChild(sessionRow(s));
    if (state.open.has(s.id) && s.subs.length) {
      const wrap = document.createElement("div"); wrap.className = "subs";
      for (const x of s.subs) wrap.appendChild(subRow(x));
      el.appendChild(wrap);
    }
  };
  const parents = list.filter(s => !s.orphan);
  for (const s of parents.filter(s => !s.earlier)) add(s);
  const earlier = parents.filter(s => s.earlier);
  if (earlier.length) {
    const b = document.createElement("div"); b.className = "grp";
    b.innerHTML = `<button class="link">${state.earlier ? "▾" : "▸"} Earlier sessions (${earlier.length})</button>`;
    b.firstChild.onclick = () => { state.earlier = !state.earlier; renderRail(); };
    el.appendChild(b);
    if (state.earlier) for (const s of earlier) add(s);
  }
  const orphans = list.filter(s => s.orphan);
  if (orphans.length) {
    const g = document.createElement("div"); g.className = "grp"; g.textContent = `Sub-runs without a listed parent (${orphans.length})`;
    el.appendChild(g);
    for (const s of orphans) el.appendChild(subRow(s));
  }
  el.scrollTop = keep;
}

// ── decisions ──
const DECISIONS_SHOWN = 5;
const catchByKey = k => [state.att, state.wide].filter(Boolean).map(a => a.catches.find(c => c.key === k)).find(Boolean);
const attOf = c => state.att && state.att.catches.includes(c) ? state.att : state.wide;
const sessionPool = () => [state.att, state.wide].filter(Boolean).flatMap(a => a.sessions.concat(...a.sessions.map(x => x.subs)));
const allSessions = () => state.att.sessions.concat(...state.att.sessions.map(x => x.subs));
const sessionOf = c => sessionPool().find(x => x.ref === c.sessionRef);

function steerLine(key) {
  const st = state.steerState[key];
  if (!st) return "";
  if (st.state === "sent") return `<span class="green">Steer delivered</span>`;
  if (st.state === "rejected") return `<span class="red">Steer rejected${st.reason ? ": " + esc(st.reason) : ""}</span>`;
  if (st.state === "error") return `<span class="amber">Steer state unknown</span>`;
  return `<span>Steer pending${st.ageMs > 30000 ? " (nothing has picked it up yet)" : ""}</span>`;
}

function decisionRow(c, extra, handled) {
  const d = document.createElement("div");
  d.className = "drow" + (handled ? " handled" : "") + (!handled && isNew(c) && !state.shown.has(c.key) ? " fresh" : "");
  state.shown.add(c.key);
  d.tabIndex = 0;
  const label = handled ? handledLabel(c) : (KIND[c.kind] || "Assumption");
  const more = extra > 0 ? ` · +${extra} more from this turn` : "";
  const steer = steerLine(c.key) || (c.saved ? "Saved" : "");
  d.innerHTML = `<div class="body"><div class="head">${!handled && isNew(c) ? '<span class="newlabel">New</span>' : ""}${esc(clip(c.decision, 110))}</div>
    <div class="why">${esc(clip(c.basis || (c.alternatives.length ? "Instead: " + c.alternatives.join(" · ") : ""), 100))}</div>
    <div class="meta"><span class="${handled ? "" : "tag"}">${label}</span> · ${esc(c.project)}${c.name ? " · " + esc(c.name) : ""} · ${ago(Date.parse(c.timestamp))} ago${more}${steer ? " · " + steer : ""}</div></div>
    ${handled ? "" : '<button class="act pri" data-a="steer">Steer</button>'}`;
  d.onclick = ev => nav(catchUrl(c.key), { steer: ev.target.dataset && ev.target.dataset.a === "steer" });
  d.onkeydown = ev => { if (ev.key === "Enter" && ev.target === d) nav(catchUrl(c.key)); };
  return d;
}

function handledLabel(c) {
  if (c.verdict) return c.verdict === "useful" ? "Useful" : "Noise";
  if (state.att.outcomes.some(o => o.catchKey === c.key)) return "Corrected later";
  if (c.saved) return "Saved to memory";
  return "Session idle";
}

function renderDecisions() {
  const a = state.att, el = $("dlist");
  if (!a) return;
  const keep = el.parentNode.scrollTop;
  const list = a.decisions.map(d => ({ c: catchByKey(d.keys[0]), extra: d.keys.length - 1 })).filter(x => x.c);
  $("dcount").textContent = list.length ? `${list.length} open` : "";
  el.innerHTML = "";
  if (!list.length) el.innerHTML = '<div id="none">No decisions need you. Sessions are still listed at left.</div>';
  for (const x of (state.moreDecisions ? list : list.slice(0, DECISIONS_SHOWN))) el.appendChild(decisionRow(x.c, x.extra, false));
  if (list.length > DECISIONS_SHOWN) {
    const b = document.createElement("button");
    b.textContent = state.moreDecisions ? "Fewer" : `More (${list.length - DECISIONS_SHOWN})`;
    b.onclick = () => { state.moreDecisions = !state.moreDecisions; renderDecisions(); };
    el.appendChild(b);
  }
  const open = new Set(a.decisions.flatMap(d => d.keys));
  const done = a.catches.filter(c => !open.has(c.key));
  if (done.length) {
    const h = document.createElement("div"); h.className = "hist";
    h.innerHTML = `<button class="link">${state.history ? "▾" : "▸"} Handled (${done.length})</button>`;
    h.firstChild.onclick = () => { state.history = !state.history; renderDecisions(); };
    if (state.history) for (const c of done.slice(0, 30)) h.appendChild(decisionRow(c, 0, true));
    el.appendChild(h);
  }
  el.parentNode.scrollTop = keep;
  if (state.panel && state.panel.kind === "catch") renderCatchPanel(false);
}

// ── steer delivery state ──
function saveSteers() {
  const cutoff = Date.now() - 86400000, keep = {};
  for (const [k, v] of Object.entries(state.steers)) if (v.at > cutoff) keep[k] = v;
  state.steers = keep; localStorage.setItem("attention.steers", JSON.stringify(keep));
}
async function pollSteers() {
  let changed = false;
  for (const [key, v] of Object.entries(state.steers)) {
    const st = state.steerState[key];
    if (st && (st.state === "sent" || st.state === "rejected")) continue;
    try { state.steerState[key] = await api("/api/steer/status?id=" + encodeURIComponent(v.id)); }
    catch (e) { state.steerState[key] = { state:"error" }; }
    changed = true;
  }
  if (changed && state.att) { renderDecisions(); if (state.panel && state.panel.kind === "memory") renderMemList(); }
}
setInterval(() => pollSteers().catch(() => {}), 2500);


// ── work memory ──
const MEM_STATES = [["relevant", "Relevant"], ["stale", "Stale"], ["open", "All open"], ["done", "Done"]];
const daysAgo = day => Math.max(0, Math.floor((Date.now() - Date.parse(day + "T00:00:00Z")) / 864e5));
const safeHref = h => /^https?:\/\//.test(h) ? h : "#";

async function refreshMemory() {
  try {
    const r = await api("/api/memory/items?state=open");
    state.mem.summary = { counts: r.counts, atRisk: r.items.filter(i => i.atRisk) };
    state.mem.repos = [...new Map(r.items.filter(i => i.cwd).map(i => [i.cwd, i.repo])).entries()];
  } catch (e) { /* keep the last summary */ }
  renderMemoryGlance();
}

function renderMemoryGlance() {
  const m = state.mem.summary, ctl = $("memctl"), warn = $("memwarn");
  if (!m) { ctl.textContent = "Work memory"; warn.textContent = ""; return; }
  ctl.innerHTML = `Work memory · ${m.counts.open} open${m.counts.atRisk ? ` · <span class="amber">${m.counts.atRisk} dropping soon</span>` : ""}`;
  warn.innerHTML = "";

    b.onclick = () => nav("/memory/" + encodeURIComponent(first.id));
    warn.appendChild(b);
  }
}

function openMemory(spec) {
  const m = state.mem, focusId = spec.focusId || null;
  state.ref = null; state.panel = { kind:"memory" };
  m.pick = null; m.msg = ""; m.notFound = false; m.focus = focusId;
  if (focusId) { m.q = focusId; m.state = "open"; m.repo = ""; m.expanded = focusId; m.session = null; }
  else {
    m.q = spec.q || ""; m.state = MEM_STATES.some(x => x[0] === spec.state) ? spec.state : "relevant"; m.repo = spec.repo || ""; m.expanded = null;
    const ref = spec.session && /^[0-9a-f]{16}$/.test(spec.session) ? spec.session : null;
    const known = ref && sessionPool().find(x => x.ref === ref);
    m.session = ref ? { ref, label: known ? (known.name ? `${known.project} · ${clip(known.name, 40)}` : known.project) : "session " + ref } : null;
  }
  openPanel("Work memory");
  $("panelbody").innerHTML = `<div id="memtool"><input type="text" id="memq" placeholder="Search title, status, repo, links" aria-label="Search work memory">
    <div id="memsess" class="dim"></div><div class="tabs" id="memtabs"></div><div class="row2"><label class="dim" for="memrepo">Repo</label><select id="memrepo" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:14px"></select></div></div>
    <div id="memtoast"></div><div id="memlist" style="margin-top:10px"></div><div id="memfoot" class="claim"></div>`;
  $("memq").value = m.q;
  $("memq").oninput = () => { clearTimeout(m.qt); m.qt = setTimeout(() => { m.q = $("memq").value; m.focus = null; setUrl(memUrl(), true); loadMemory(); }, 250); };
  loadMemory();
}

async function loadMemory() {
  const m = state.mem, focusId = m.focus;
  const url = st => "/api/memory/items?state=" + st + "&query=" + encodeURIComponent(m.q) + "&repo=" + encodeURIComponent(m.repo);
  try {
    let r = await api(url(m.state));
    if (focusId && !r.items.length && m.state !== "done") { m.state = "done"; r = await api(url("done")); }
    m.notFound = !!focusId && !r.items.length;
    if (m.session) r.items = r.items.filter(i => i.sessionLinks.some(l => l.ref === m.session.ref));
    Object.assign(m, { items: r.items, version: r.version, counts: r.counts, readAt: r.readAt, skipped: r.skippedLines, msg: "" });
  } catch (e) { m.msg = "Could not read work memory: " + e.message; }
  if (state.panel && state.panel.kind === "memory") { renderMemTools(); renderMemList(); }
}

function renderMemTools() {
  const m = state.mem, tabs = $("memtabs");
  if (!tabs) return;
  tabs.innerHTML = MEM_STATES.map(([k, label]) => `<button data-st="${k}" class="${m.state === k ? "on" : ""}">${label}${m.counts ? " " + m.counts[k] : ""}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => { m.state = b.dataset.st; m.expanded = null; m.session = null; m.focus = null; setUrl(memUrl(), false); loadMemory(); });
  const ses = $("memsess");
  ses.innerHTML = m.session ? `Linked to ${esc(m.session.label)} <button class="link">Show all</button>` : "";
  if (m.session) ses.querySelector("button").onclick = () => { m.session = null; m.focus = null; setUrl(memUrl(), false); loadMemory(); };
  const sel = $("memrepo");
  sel.innerHTML = '<option value="">All repos</option>' + m.repos.map(([cwd, name]) => `<option value="${esc(cwd)}">${esc(name)}</option>`).join("");
  sel.value = m.repo;
  sel.onchange = () => { m.repo = sel.value; m.focus = null; setUrl(memUrl(), false); loadMemory(); };
}

function chip(l) {
  if (l.kind === "session") return `<button class="chip" data-ref="${esc(l.ref)}">${esc(l.label)}</button>`;
  if (l.href) return `<a class="chip" href="${esc(safeHref(l.href))}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`;
  return `<span class="chip">${esc(l.label)}</span>`;
}

function renderMemToast() {
  const el = $("memtoast"), u = state.mem.undo;
  if (!el) return;
  if (!u || Date.now() > u.until) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="toast"><span class="green">Marked done:</span> ${esc(clip(u.title, 50))} <button data-a="undo">Undo (${Math.ceil((u.until - Date.now()) / 1000)}s)</button></div>`;
  el.querySelector("button").onclick = undoDone;
}

function renderMemList() {
  const m = state.mem, el = $("memlist");
  if (!el) return;
  renderMemToast();
  $("memfoot").textContent = m.msg || (m.readAt ? `Read ${clock(m.readAt)}${m.skipped ? ` · ${m.skipped} unreadable line${m.skipped === 1 ? "" : "s"} skipped` : ""} · estimates of pruning follow the 60-day rule and keepUntil` : "");
  $("memfoot").className = m.msg ? "red" : "claim";
  el.innerHTML = m.items.length ? "" : m.notFound ? `<div class="amber">Memory item <code>${esc(m.focus)}</code> not found. It was deleted or never existed.</div>` : `<div class="dim">No items here.</div>`;
  for (const it of m.items) el.appendChild(memRow(it));
}

function memRow(it) {
  const m = state.mem, open = m.expanded === it.id;
  const d = document.createElement("div");
  d.className = "mrow" + (open ? " open" : "");
  const links = [...it.links, ...it.sessionLinks];
  const age = daysAgo(it.updated);
  const risk = it.atRisk ? `<div class="risk">Drops from memory on ${esc(it.prunesOn)} unless kept.</div>` : "";
  let html = `<div class="t" ${open ? "" : 'tabindex="0"'} data-t="1">${esc(clip(it.title, open ? 300 : 90))}</div>
    <div class="m">${esc(it.repo || "no repo")} · updated ${age === 0 ? "today" : age + "d ago"}${it.stale ? " · stale" : ""}${it.done ? " · done" : ""}</div>
    <div class="s">${esc(open ? it.status : clip(it.status, 140))}</div>${risk}
    <div>${(open ? links : links.slice(0, 2)).map(chip).join("")}${!open && links.length > 2 ? `<span class="chip dim">+${links.length - 2}</span>` : ""}</div>`;
  if (open) {
    html += `<div class="kv"><span>ID</span><span><code>${esc(it.id)}</code></span><span>Created</span><span>${esc(it.created)}</span><span>Updated</span><span>${esc(it.updated)}</span>
      <span>Keep until</span><span>${esc(it.keepUntil || "not set")}</span><span>Drops on</span><span>${esc(it.prunesOn || "never (kept forever)")}</span></div>
      <div class="row2">${it.done ? "" : `<button data-a="done">Mark done</button><button data-a="keep30">Keep 30 more days</button><button data-a="forever">Keep forever</button><button data-a="pick" class="${m.pick && m.pick.id === it.id ? "on" : ""}">Pick this up</button>`}</div>
      ${m.pick && m.pick.id === it.id ? pickHtml(it) : ""}`;
  }
  d.innerHTML = html;
  d.onclick = ev => {
    if (ev.target.closest("a,button,textarea,input")) return;
    if (!open) { m.expanded = it.id; m.pick = null; renderMemList(); }
    else if (ev.target.dataset && ev.target.dataset.t) { m.expanded = null; m.pick = null; renderMemList(); }
  };
  d.onkeydown = ev => { if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.t) { m.expanded = open ? null : it.id; renderMemList(); } };
  d.querySelectorAll("button[data-ref]").forEach(b => b.onclick = () => nav(sessionUrl(b.dataset.ref)));
  d.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => memAction(it, b.dataset.a));
  const ta = d.querySelector("textarea");
  if (ta) ta.oninput = () => { m.pick.text = ta.value; };
  d.querySelectorAll("button[data-sess]").forEach(b => b.onclick = () => { m.pick.sessionId = m.pick.sessionId === b.dataset.sess ? null : b.dataset.sess; renderMemList(); });
  return d;
}

function pickDraft(it) {
  const refs = [...it.links].map(l => l.href && l.kind !== "text" ? `${l.label} ${l.href}` : l.label);
  return `Pick up this item from work memory (read the full item with the work_memory tool if needed).\nID: ${it.id}\nTitle: ${it.title}\nStatus: ${it.status}${refs.length ? "\nLinks: " + refs.join(", ") : ""}\n`;
}

function pickHtml(it) {
  const p = state.mem.pick, sessions = state.att.sessions.filter(s => !s.orphan && s.cwd && s.cwd === it.cwd);
  const st = steerLine("pick:" + it.id + ":" + p.sessionId);
  return `<div class="sect pick"><h3>Pick this up in</h3>
    ${sessions.length ? sessions.map(s => `<button class="sess ${p.sessionId === s.id ? "on" : ""}" data-sess="${esc(s.id)}">${esc(s.project)}${s.name ? " · " + esc(s.name) : ""} · ${STATUS[s.status]} · updated ${ago(s.mtime)} ago</button>`).join("") : '<div class="dim">No listed session has this exact working directory.</div>'}
    <label class="f">Message (edit before sending)</label><textarea>${esc(p.text)}</textarea>
    <div class="row2"><button class="pri" data-a="sendpick" ${p.sessionId ? "" : "disabled"}>Send to chosen session</button><span class="state">${p.sessionId ? st : "Choose a session first."}</span><span class="red">${esc(p.err || "")}</span></div></div>`;
}

async function memFail(e) {
  const msg = /changed/.test(e.message) ? "Work memory changed on disk; the list was reloaded. Try again." : "Failed: " + e.message;
  await loadMemory();
  state.mem.msg = msg;
  renderMemList();
}

async function memAction(it, a) {
  const m = state.mem;
  try {
    if (a === "pick") { m.pick = m.pick && m.pick.id === it.id ? null : { id: it.id, sessionId: null, text: pickDraft(it), err: "" }; return renderMemList(); }
    if (a === "sendpick") {
      const p = m.pick; p.err = "";
      if (!p.sessionId || !p.text.trim()) { p.err = "Choose a session and write a message."; return renderMemList(); }
      const r = await post("/api/steer", { sessionId: p.sessionId, text: p.text });
      state.steers["pick:" + it.id + ":" + p.sessionId] = { id: r.id, at: Date.now() }; state.steerState["pick:" + it.id + ":" + p.sessionId] = { state:"pending", ageMs:0 }; saveSteers();
      return renderMemList();
    }
    const body = a === "done" ? { done: true } : a === "keep30" ? { keepUntil: "+30d" } : { keepUntil: "forever" };
    const r = await post("/api/memory/update", { id: it.id, version: m.version, ...body });
    m.version = r.version;
    if (a === "done") {
      clearInterval(m.tick);
      m.undo = { id: it.id, title: it.title, updated: it.updated, until: Date.now() + 5000 };
      m.tick = setInterval(() => { if (Date.now() > m.undo.until) { clearInterval(m.tick); m.undo = null; } renderMemToast(); }, 500);
    }
    await loadMemory(); refreshMemory();
  } catch (e) { await memFail(e); }
}

async function undoDone() {
  const m = state.mem, u = m.undo;
  if (!u || Date.now() > u.until) return;
  try {
    const r = await post("/api/memory/update", { id: u.id, version: m.version, done: false, updated: u.updated });
    m.version = r.version; m.undo = null; clearInterval(m.tick);
    await loadMemory(); refreshMemory();
  } catch (e) { m.undo = null; await memFail(e); }
}

function openContextRef(ref, title) {
  nav(sessionUrl(ref));
}

// ── Inspect panel ──
// The URL decides which panel is open; see route().
const catchUrl = key => "/decision/" + encodeURIComponent(key);
const sessionUrl = (ref, request) => "/session/" + ref + (request ? "?request=" + request : "");
function memUrl(o) {
  const m = state.mem, f = o || { state: m.state, q: m.q, repo: m.repo, session: m.session && m.session.ref };
  if (!o && m.focus) return "/memory/" + encodeURIComponent(m.focus);
  const p = new URLSearchParams();
  if (f.state && f.state !== "relevant") p.set("state", f.state);
  if (f.q) p.set("q", f.q);
  if (f.repo) p.set("repo", f.repo);
  if (f.session) p.set("session", f.session);
  const qs = p.toString();
  return "/memory" + (qs ? "?" + qs : "");
}
const currentUrl = () => location.pathname + location.search;
function setUrl(url, replace) { if (url !== currentUrl()) history[replace ? "replaceState" : "pushState"](null, "", url); }
function nav(url, opts) { setUrl(url, false); route(opts || {}); }

function route(opts = {}) {
  const u = new URL(location.href), seg = u.pathname.split("/").slice(1).map(x => { try { return decodeURIComponent(x); } catch { return x; } });
  const q = u.searchParams;
  if (seg[0] === "decision" && seg[1]) return openCatch(seg[1], opts.steer);
  if (seg[0] === "memory") return openMemory({ focusId: seg[1], state: q.get("state"), q: q.get("q"), repo: q.get("repo"), session: q.get("session") });
  if (seg[0] === "session" && seg[1]) return openContext(seg[1], q.get("request"));
  dismissPanel();
}

function openPanel(title) { $("paneltitle").textContent = title; $("panel").classList.add("open"); }
function dismissPanel() { $("panel").classList.remove("open"); state.ref = null; state.panel = null; if (state.att) renderRail(); }
function closePanel() { nav("/"); }
async function copyLink() {
  const url = location.origin + currentUrl(), b = $("copylink");
  try { await navigator.clipboard.writeText(url); }
  catch {
    const t = document.createElement("textarea"); t.value = url; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch { /* shown below */ } t.remove();
  }
  b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy link"; }, 1500);
}

// Catch detail: the full claim, its source, linked outcomes, and the actions with drafts.
async function openCatch(key, steer) {
  const p = state.panel = { kind:"catch", key };
  state.ref = null;
  openPanel("Decision");
  if (state.att) renderRail();
  if (!catchByKey(key)) {
    $("panelbody").innerHTML = '<p class="dim">Looking back 14 days…</p>';
    try { state.wide = await api("/api/attention?hours=336"); } catch { state.wide = null; }
    if (state.panel !== p) return;
  }
  const c = catchByKey(key);
  if (!c) { renderCatchPanel(true); return; }
  markSeen([key]);
  if (steer && state.drafts[key] === undefined) state.drafts[key] = `About your assumption "${clip(c.decision, 110)}": `;
  openPanel(`${KIND[c.kind] || "Assumption"} · ${c.project}${c.name ? " · " + c.name : ""}`);
  renderCatchPanel(true);
  if (steer) { const t = $("steertext"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
}

function outcomeText(o) {
  if (o.type === "esc") return `<b>Esc</b>, then you wrote: ${esc(o.correction || "")}`;
  if (o.type === "steer") return `<b>Steered</b>: ${esc(o.correction || "")}`;
  return `<b>Rewind</b>: dropped ${o.requests} request${o.requests === 1 ? "" : "s"}, ${fmtK(o.droppedContextTokens || 0)} context tokens`;
}

function renderCatchPanel(force) {
  const p = state.panel, c = p && catchByKey(p.key), body = $("panelbody");
  if (!c) { body.innerHTML = '<p class="amber">Decision not found. It is older than 14 days, its session file is gone, or the link is wrong.</p>'; return; }
  if (!force && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName) && body.contains(document.activeElement)) return;
  const s = sessionOf(c);
  const idle = s && s.status === "idle";
  const outs = attOf(c).outcomes.filter(o => o.catchKey === c.key);
  const older = attOf(c) !== state.att ? '<div class="claim">Older than 24 hours, so it is not in the decision list.</div>' : "";
  const alts = c.alternatives.length ? `<div class="claim">Other readings: ${c.alternatives.map(esc).join(" · ")}</div>` : "";
  const sav = c.saving ? `<div class="out">Observed work between this catch and your ${c.saving.via === "esc" ? "Esc correction" : c.saving.via === "rewind" ? "rewind" : "steer"}: ${fmtCost(c.saving.cost)} and ${fmtK(c.saving.tokens)} tokens over ${c.saving.requests} request${c.saving.requests === 1 ? "" : "s"}. Estimate: input, output and cache-write tokens; not money saved.</div>` : "";
  const steerSt = steerLine(c.key);
  const draft = c.memoryDraft, md = state.drafts["mem:" + c.key] || {};
  const verdict = c.verdict ? `<span class="${c.verdict === "useful" ? "green" : "dim"}">Marked ${c.verdict}.</span> <button data-a="undo">Undo</button>` : "";
  const saved = c.saved ? `<div><span class="green">Saved</span> to work memory as <code>${esc(c.saved.itemId)}</code>. <button class="link" data-a="item">View item</button></div>` : `
    <label class="f">Title</label><input type="text" id="memtitle" maxlength="200" value="${esc(md.title ?? draft.title)}">
    <label class="f">Status</label><input type="text" id="memstatus" maxlength="500" value="${esc(md.status ?? draft.status)}">
    <div class="row2"><button data-a="save">Save to memory</button></div>`;
  $("panelbody").innerHTML = `
    ${older}<div class="dec">${esc(c.decision)}</div>${alts}
    ${c.basis ? `<div class="claim">Agent's claim, not verified: ${esc(c.basis)}</div>` : ""}
    <div class="claim" style="margin-top:6px">Request ${c.requestIndex + 1} · turn ${c.turnIndex} · ${new Date(c.timestamp).toLocaleString()} · ${esc(KIND[c.kind] || "")}</div>
    <div class="row2"><button data-a="context">Open context at this request</button></div>
    ${outs.length || sav ? `<div class="sect"><h3>What happened next</h3>${outs.map(o => `<div class="out">${outcomeText(o)} · ${ago(Date.parse(o.timestamp))} ago</div>`).join("")}${sav}</div>` : ""}
    <div class="sect"><h3>Steer</h3>
      <div class="claim">To: ${s ? esc(s.project) + (s.name ? " · " + esc(s.name) : "") : "session not listed"} · tab <span class="tab">π - ${esc(c.name || "")}${c.name ? " - " : ""}${esc(c.project)}</span></div>
      ${idle ? `<div class="amber">This session looks idle (last reply ${s.lastAssistantMs ? ago(s.lastAssistantMs) + " ago" : "unknown"}). A steer may wait until pi runs it.</div>` : ""}
      <textarea id="steertext" placeholder="Message to this session. Nothing is sent until you press Send.">${esc(state.drafts[c.key] || "")}</textarea>
      <div class="row2"><button class="pri" data-a="send">${idle ? "Send anyway" : "Send"}</button><span class="state">${steerSt}</span><span class="red">${esc(state.msg[c.key] || "")}</span></div></div>
    <div class="sect"><h3>Memory</h3>${saved}</div>
    <div class="sect"><h3>Verdict</h3><div class="row2"><button data-a="useful" class="${c.verdict === "useful" ? "sel" : ""}">Useful</button><button data-a="noise" class="${c.verdict === "noise" ? "sel" : ""}">Noise</button>${verdict}</div></div>`;
  const ta = $("steertext");
  if (ta) ta.oninput = () => { state.drafts[c.key] = ta.value; };
  const mt = $("memtitle"), ms = $("memstatus");
  if (mt) mt.oninput = () => { state.drafts["mem:" + c.key] = { title: mt.value, status: ms.value }; };
  if (ms) ms.oninput = mt.oninput;
  body.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => catchAction(c, b.dataset.a));
}

async function catchAction(c, a) {
  state.msg[c.key] = "";
  try {
    if (a === "context") return nav(sessionUrl(c.sessionRef, c.requestIndex + 1));
    if (a === "item") return nav("/memory/" + encodeURIComponent(c.saved.itemId));
    if (a === "send") {
      const text = (state.drafts[c.key] || "").trim();
      if (!text) { state.msg[c.key] = "Write a message first."; return renderCatchPanel(true); }
      const r = await post("/api/steer", { sessionId: c.sessionId, text });
      state.steers[c.key] = { id: r.id, at: Date.now() }; state.steerState[c.key] = { state:"pending", ageMs:0 }; saveSteers();
      delete state.drafts[c.key];
    } else if (a === "save") {
      const t = $("memtitle").value, st = $("memstatus").value;
      await post("/api/memory", { catchKey: c.key, title: t, status: st });
      delete state.drafts["mem:" + c.key];
    } else {
      const v = a === "undo" ? "none" : a;
      await post("/api/verdict", { catchKey: c.key, verdict: v });
    }
    await refresh();
  } catch (e) { state.msg[c.key] = "Failed: " + e.message; }
  renderCatchPanel(true);
}

function openContext(ref, request) {
  const s = sessionPool().find(x => x.ref === ref);
  const n = request === null || request === undefined ? null : /^[1-9]\d{0,8}$/.test(request) ? Number(request) : NaN;
  state.panel = { kind:"context" };
  state.ref = ref; state.sel = n === null || Number.isNaN(n) ? null : n - 1; state.reqMissing = Number.isNaN(n) ? request : null;
  state.openSources = new Set(); state.series = null; state.detail = null; state.sessErr = null;
  openPanel(s ? s.project + (s.name ? " · " + s.name : "") : "Session " + ref);
  $("panelbody").innerHTML = `<div id="reqnote" class="amber"></div><div class="nums" id="nums"></div>
    <div class="box" id="chartbox"><div id="head"></div><svg id="chart"></svg></div>
    <div class="box" id="treebox"><svg id="tree"></svg></div>
    <div class="claim" id="excerpt" style="margin-top:10px"></div>
    <h3>Context by source (estimated tokens; click to expand)</h3><div id="srcs"></div><div id="legend"></div>`;
  $("legend").innerHTML = SOURCES.map(x => `<span><i class="sw" style="background:${COLORS[x]}"></i>${x}</span>`).join("");
  renderRail();
  loadSession();
}

async function loadSession() {
  if (!state.ref) return;
  const ref = state.ref;
  try {
    const series = await api("/api/session?ref=" + ref);
    if (ref !== state.ref) return;
    state.series = series;
    if (state.sel !== null && state.sel >= series.points.length) { state.reqMissing = String(state.sel + 1); state.sel = null; }
    await loadDetail();
  } catch (e) {
    if (ref !== state.ref) return;
    state.series = null; state.detail = null; state.sessErr = /\b404\b/.test(e.message) ? "Session not found. It is outside the served directories or was deleted." : "Could not read this session: " + e.message;
    $("panelbody").innerHTML = `<p class="amber">${esc(state.sessErr)}</p>`;
    return;
  }
  render();
}

async function loadDetail() {
  const n = state.series ? state.series.points.length : 0;
  if (!n) { state.detail = null; return; }
  const i = state.sel === null ? n - 1 : state.sel;
  try { state.detail = await api("/api/request?ref=" + state.ref + "&i=" + i); } catch { state.detail = null; }
}

async function select(i) { state.sel = i; state.reqMissing = null; setUrl(sessionUrl(state.ref, i + 1), false); await loadDetail(); render(); }

function svg(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function tip(html, ev) {
  const t = $("tip");
  if (html === null) { t.style.display = "none"; return; }
  t.innerHTML = html; t.style.display = "block";
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.min(ev.clientX + 14, innerWidth - w - 8) + "px";
  t.style.top = Math.min(ev.clientY + 14, innerHeight - h - 8) + "px";
}

function renderChart() {
  const root = $("chart"); root.innerHTML = "";
  const box = $("chartbox").getBoundingClientRect();
  const W = Math.max(100, box.width - 12), H = Math.max(100, box.height - 12);
  root.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const pts = state.series ? state.series.points : [];
  const head = $("head");
  if (!pts.length) { head.textContent = state.series ? "no requests yet" : "loading…"; return; }
  head.innerHTML = `<span>${pts.length} requests · ${state.series.compactions.length} compactions</span><span>context tokens by source (estimates)</span>`;
  const L = 52, B = 22, T = 34, R = 8;
  const pw = W - L - R, ph = H - T - B;
  const max = Math.max(...pts.map(p => p.contextTokens), 1) * 1.05;
  const x = i => L + (pts.length === 1 ? pw / 2 : (i / (pts.length - 1)) * pw);
  const y = v => T + ph - (v / max) * ph;
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    svg("line", { x1:L, x2:W-R, y1:y(v), y2:y(v), stroke:"#2a313c" }, root);
    const t = svg("text", { x:L-6, y:y(v)+5, fill:"#8b949e", "font-size":14, "text-anchor":"end" }, root); t.textContent = fmtK(v);
  }
  const tokens = pts.map(p => { const o = {}; for (const s of SOURCES) o[s] = p.totalChars ? (p.chars[s] || 0) / p.totalChars * p.contextTokens : 0; return o; });
  const base = pts.map(() => 0);
  for (const s of SOURCES) {
    if (!pts.some((p, i) => tokens[i][s] > 0)) continue;
    const top = pts.map((_, i) => base[i] + tokens[i][s]);
    let d = pts.map((_, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(top[i]).toFixed(1)).join("");
    d += pts.map((_, i) => "L" + x(pts.length - 1 - i).toFixed(1) + " " + y(base[pts.length - 1 - i]).toFixed(1)).join("") + "Z";
    svg("path", { d, fill:COLORS[s], "fill-opacity":.85 }, root);
    for (let i = 0; i < pts.length; i++) base[i] = top[i];
  }
  let lastLabel = -Infinity;
  for (const c of state.series.compactions) {
    svg("line", { x1:x(c), x2:x(c), y1:T, y2:T+ph, stroke:"#fff", "stroke-dasharray":"4 4", "stroke-width":1.5 }, root);
    if (x(c) - lastLabel < 110) continue;
    const t = svg("text", { x:x(c)+4, y:T+14, fill:"#fff", "font-size":14 }, root); t.textContent = "compaction";
    lastLabel = x(c);
  }
  const cur = state.sel === null ? pts.length - 1 : state.sel;
  svg("line", { x1:x(cur), x2:x(cur), y1:T, y2:T+ph, stroke:"#58a6ff", "stroke-width":2 }, root);
  const hover = svg("line", { y1:T, y2:T+ph, stroke:"#fff8", display:"none" }, root);
  const overlay = svg("rect", { x:L, y:T, width:pw, height:ph, fill:"transparent", style:"cursor:crosshair" }, root);
  const at = ev => {
    const r = root.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width) - L;
    return Math.max(0, Math.min(pts.length - 1, Math.round(px / pw * (pts.length - 1))));
  };
  overlay.onmousemove = ev => {
    const i = at(ev), p = pts[i];
    hover.setAttribute("x1", x(i)); hover.setAttribute("x2", x(i)); hover.removeAttribute("display");
    const turn = state.series.turns.find(t => t.turnIndex === p.turnIndex);
    const rows = SOURCES.filter(s => tokens[i][s] >= 1).sort((a, b) => tokens[i][b] - tokens[i][a])
      .map(s => `<div><i class="sw" style="background:${COLORS[s]}"></i>${s}: <b>~${fmtK(tokens[i][s])}</b></div>`).join("");
    tip(`<b>request ${p.requestIndex + 1} of ${pts.length}</b> · turn ${p.turnIndex} · ${fmtK(p.contextTokens)} tokens<br>${esc(p.model)}${rows}${turn && turn.userText ? `<div style="margin-top:6px;color:#8b949e">${esc(turn.userText)}${turn.userText.length >= 120 ? " […]" : ""}</div>` : ""}`, ev);
  };
  overlay.onmouseleave = () => { hover.setAttribute("display", "none"); tip(null); };
  overlay.onclick = ev => select(at(ev));
}

function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, i) => s + i.chars, 0);
  if (total <= 0) return out;
  const scale = (w * h) / total;
  let rest = items.map(it => ({ it, a: it.chars * scale }));
  while (rest.length) {
    const side = Math.min(w, h);
    const worst = (sum, mx, mn) => Math.max(side * side * mx / (sum * sum), sum * sum / (side * side * mn));
    let n = 0, sum = 0, mx = 0, mn = Infinity, best = Infinity;
    while (n < rest.length) {
      const a = rest[n].a, s2 = sum + a, mx2 = Math.max(mx, a), mn2 = Math.min(mn, a);
      const wv = worst(s2, mx2, mn2);
      if (n > 0 && wv > best) break;
      sum = s2; mx = mx2; mn = mn2; best = wv; n++;
    }
    const row = rest.splice(0, n);
    if (w >= h) {
      const rw = sum / h; let cy = y;
      for (const r of row) { const rh = r.a / rw; out.push({ it: r.it, x, y: cy, w: rw, h: rh }); cy += rh; }
      x += rw; w -= rw;
    } else {
      const rh = sum / w; let cx = x;
      for (const r of row) { const rw = r.a / rh; out.push({ it: r.it, x: cx, y, w: rw, h: rh }); cx += rw; }
      y += rh; h -= rh;
    }
  }
  return out;
}

function renderTree() {
  const root = $("tree"); root.innerHTML = "";
  const box = $("treebox").getBoundingClientRect();
  const W = Math.max(100, box.width - 12), H = Math.max(100, box.height - 12);
  root.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const d = state.detail;
  if (!d) return;
  const segs = d.segments.filter(s => s.chars > 0).sort((a, b) => b.chars - a.chars);
  for (const r of squarify(segs, 0, 0, W, H)) {
    if (r.w < 1 || r.h < 1) continue;
    const s = r.it;
    const g = svg("g", {}, root);
    svg("rect", { x:r.x, y:r.y, width:r.w, height:r.h, fill:COLORS[s.source] || "#666", stroke:"#0e1116", "stroke-width":1.5 }, g);
    if (r.w > 80 && r.h > 34) {
      const t = svg("text", { x:r.x+6, y:r.y+18, fill:"#0e1116", "font-size":14, "font-weight":600 }, g);
      const label = s.label || s.source;
      const max = Math.floor((r.w - 12) / 8);
      t.textContent = label.length > max ? label.slice(0, Math.max(1, max - 1)) + "…" : label;
      if (r.h > 54) { const t2 = svg("text", { x:r.x+6, y:r.y+35, fill:"#0e1116", "font-size":14 }, g); t2.textContent = "~" + fmtK(s.tokens) + " tok"; }
    }
    g.onmousemove = ev => tip(`<i class="sw" style="background:${COLORS[s.source]}"></i><b>${s.source}</b>${s.label ? " · " + esc(s.label) : ""}<br>${s.chars.toLocaleString()} chars · ~${s.tokens.toLocaleString()} tokens (estimate)<br>age ${s.ageTurns} turns · position ${s.position}`, ev);
    g.onmouseleave = () => tip(null);
  }
}

function renderNums() {
  const d = state.detail, nums = $("nums"), top = $("srcs");
  if (!nums) return;
  nums.innerHTML = ""; top.innerHTML = "";
  if (!d) return;
  const n = state.series.points.length;
  const through = state.series.points.slice(0, d.requestIndex + 1).reduce((s, p) => s + p.cost, 0);
  const total = state.series.points.reduce((s, p) => s + p.cost, 0);
  const cells = [["request", `${d.requestIndex + 1} of ${n}`], ["turn", d.turnIndex], ["context tokens", fmtK(d.contextTokens)],
    ["cost through request", fmtCost(through)], ["session total", fmtCost(total)], ["compactions", state.series.compactions.length]];
  for (const [k, v] of cells) nums.insertAdjacentHTML("beforeend", `<div class="num"><div class="v">${v}</div><div class="k">${k}</div></div>`);
  const turn = state.series.turns.find(t => t.turnIndex === d.turnIndex);
  const ex = $("excerpt");
  ex.textContent = turn && turn.userText ? `Turn ${d.turnIndex} prompt: "${turn.userText}${turn.userText.length >= 120 ? " […]" : ""}"` : "";
  for (const g of [...d.bySource].sort((x, y) => y.chars - x.chars)) {
    const open = state.openSources.has(g.source);
    top.insertAdjacentHTML("beforeend", `<div class="seg g" data-s="${esc(g.source)}"><i class="sw" style="background:${COLORS[g.source] || "#666"}"></i><span class="n">${open ? "▾" : "▸"} ${esc(g.source)} · ${g.count} block${g.count === 1 ? "" : "s"}</span><span class="v">~${fmtK(g.tokensEstimate)}</span></div>`);
    if (open) for (const x of d.segments.filter(x => x.source === g.source).sort((p, q) => q.chars - p.chars).slice(0, 40)) {
      top.insertAdjacentHTML("beforeend", `<div class="seg sub2"><span class="n" title="${esc(x.label || x.source)}">${esc(x.label || x.source)} · ${x.chars.toLocaleString()} chars · age ${x.ageTurns} turns</span><span class="v">~${fmtK(x.tokens)}</span></div>`);
    }
  }
  top.querySelectorAll(".seg.g").forEach(el => el.onclick = () => { const k = el.dataset.s; state.openSources.has(k) ? state.openSources.delete(k) : state.openSources.add(k); renderNums(); });
}

function render() {
  if (!$("chart")) return;
  const n = state.series ? state.series.points.length : 0;
  $("reqnote").textContent = state.reqMissing ? `Request ${state.reqMissing} not found (this session has ${n}). Showing the latest.` : "";
  renderChart(); renderTree(); renderNums(); }

$("close").onclick = closePanel;
$("copylink").onclick = copyLink;
addEventListener("popstate", () => route());
$("memctl").onclick = () => nav("/memory");
addEventListener("keydown", ev => { if (ev.key === "Escape" && $("panel").classList.contains("open") && !/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) closePanel(); });
addEventListener("resize", () => { if (state.ref) render(); });

function connect() {
  const es = new EventSource("/events");
  const boot = (document.querySelector('meta[name="attention-boot"]') || {}).content || "";
  // The server restarted (pi start brings it back): reload to pick up its new POST token.
  es.addEventListener("boot", ev => { if (boot && ev.data !== boot) location.reload(); });
  es.addEventListener("memory", () => {
    refreshMemory();
    const typing = /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
    if (state.panel && state.panel.kind === "memory" && !typing) loadMemory();
  });
  es.onmessage = async ev => {
    const { path } = JSON.parse(ev.data);
    await refresh().catch(() => {});
    if (state.ref && path && state.series && state.series.path === path) await loadSession();
  };
}
localStorage.removeItem("attention.panel");
refresh().catch(() => {}).then(() => route()).then(connect);
refreshMemory();
setInterval(() => { refresh().catch(() => {}); renderRail(); refreshMemory(); }, 15000);
</script>
</body>
</html>
