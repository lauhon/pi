<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pi attention</title>
<style>
:root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.35 -apple-system,"Segoe UI",sans-serif; overflow:hidden; }
#right { display:flex; flex-direction:column; padding:10px; overflow:hidden; }
.row { padding:7px 8px; border-radius:6px; cursor:pointer; border-left:3px solid transparent; }
.row:hover { background:var(--panel); }
.row.sel { background:var(--panel); border-left-color:var(--accent); }
.row .t { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
.row .t span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .s { color:var(--dim); font-size:13px; display:flex; justify-content:space-between; }
.live { color:#3fb950; } .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#3fb950; margin-right:6px; box-shadow:0 0 6px #3fb950; }
button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
button.on { border-color:#3fb950; color:#3fb950; }
h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:600; }
#main { display:grid; grid-template-rows:1fr 1fr; gap:1px; background:var(--line); }
#main > div { background:var(--bg); position:relative; min-height:0; padding:8px; }
svg { width:100%; height:100%; display:block; }
#head { position:absolute; top:8px; left:12px; right:12px; display:flex; flex-wrap:wrap; gap:4px 16px; justify-content:space-between; color:var(--dim); pointer-events:none; z-index:1; }
#tip { position:fixed; pointer-events:none; background:#000d; border:1px solid var(--line); border-radius:6px; padding:8px 10px; max-width:420px; font-size:13px; display:none; z-index:5; }
#tip b { color:#fff; } .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
.nums { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.num { background:var(--panel); border-radius:8px; padding:8px 10px; }
.num .v { font-size:26px; font-weight:700; } .num .k { color:var(--dim); font-size:12px; }
.seg { display:flex; gap:6px; padding:4px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:center; }
.seg .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .seg .v { color:var(--dim); font-variant-numeric:tabular-nums; }
#legend { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:12px; color:var(--dim); margin-top:auto; padding-top:10px; }
#empty { padding:40px; color:var(--dim); font-size:18px; }

#app { display:grid; grid-template-columns:480px 1fr; height:100vh; gap:1px; background:var(--line); }
#app > div { background:var(--bg); min-height:0; min-width:0; }
#left { padding:14px 10px; display:flex; flex-direction:column; overflow:hidden; }
#slist { overflow-y:auto; flex:1; }
.srow { padding:9px 10px; border-radius:6px; cursor:pointer; border-left:3px solid transparent; display:grid; grid-template-columns:1fr auto; gap:2px 10px; }
.srow:hover { background:var(--panel); }
.srow.focus { border-left-color:#58a6ff55; background:#58a6ff0d; }
.srow .p { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .nm { color:var(--dim); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .meta { text-align:right; color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
.st { font-size:13px; font-weight:600; }
.st.working { color:#3fb950; } .st.waiting { color:#e3b341; } .st.idle { color:var(--dim); font-weight:400; }
.subs { margin:0 0 4px 22px; } .subs .srow { padding:5px 10px; font-size:13px; }
.tg { cursor:pointer; color:var(--dim); font-size:12px; user-select:none; margin-left:6px; }
#center { padding:18px 24px; overflow-y:auto; }
#center h1 { margin:0 0 14px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:600; display:flex; justify-content:space-between; }
#nothing { color:var(--dim); font-size:22px; padding:60px 0; text-align:center; }
.catch { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
.catch.hot { border-color:#f0883e; border-left-color:#f0883e; background:#f0883e14; box-shadow:0 0 0 1px #f0883e66; }
.catch .who { display:flex; gap:10px; align-items:center; color:var(--dim); font-size:13px; }
.catch .who b { color:var(--fg); }
.badge { padding:1px 8px; border-radius:10px; background:#2a313c; font-size:12px; color:var(--fg); }
.badge.schema { background:#a371f733; } .badge.scope { background:#58a6ff33; }
.catch .dec { font-size:22px; line-height:1.3; margin:8px 0; font-weight:600; }
.alts { color:var(--dim); font-size:14px; margin-bottom:6px; } .est { color:#3fb950; font-size:13px; margin-bottom:8px; }
.acts { display:flex; gap:8px; margin-top:8px; } .acts button.v { margin-left:auto; } .acts button.sel { border-color:#3fb950; color:#3fb950; } .acts button.sel.noise { border-color:#8b949e; color:#8b949e; }
.steer { display:none; margin-top:8px; } .steer.open { display:flex; gap:8px; }
.steer textarea { flex:1; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; min-height:60px; resize:vertical; }
.out { margin:6px 0 0 18px; padding:4px 10px; border-left:2px solid var(--line); color:var(--dim); font-size:13px; }
.out b { color:var(--fg); font-weight:600; }
.msg { color:#f85149; font-size:13px; margin-top:6px; }
#drill { position:fixed; inset:0; background:var(--bg); display:none; z-index:10; grid-template-columns:1fr 340px; grid-template-rows:auto 1fr; }
#drill.open { display:grid; }
#drillbar { grid-column:1 / 3; display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); color:var(--dim); }
#drillbar button { margin-left:auto; }
</style>
</head>
<body>
<div id="app">
  <div id="left"><h2>Sessions · last 24 h</h2><div id="slist"></div></div>
  <div id="center"><h1><span>Inbox</span><span id="stats"></span></h1><div id="inbox"></div></div>
</div>
<div id="drill">
  <div id="drillbar"><b id="drilltitle"></b><button id="close">Close</button></div>
  <div id="main"><div id="chartbox"><div id="head"></div><svg id="chart"></svg></div><div id="treebox"><svg id="tree"></svg></div></div>
  <div id="right">
    <div class="nums" id="nums"></div>
    <h2>Largest segments</h2><div id="top"></div>
    <div id="legend"></div>
  </div>
</div>
<div id="tip"></div>
<script>
"use strict";
const COLORS = {
  "system.preamble":"#1f6feb","system.tools":"#388bfd","system.rules":"#58a6ff","system.docs":"#79c0ff","system.addendum":"#a5d6ff",
  "system.project_context":"#2dd4bf","system.skills":"#14b8a6","system.cwd":"#99f6e4","system.other":"#5eead4",
  "tool_description":"#a371f7","user":"#3fb950","assistant.text":"#f0883e","assistant.thinking":"#e3b341","assistant.tool_call":"#f778ba",
  "tool_result":"#f85149","custom_message":"#56d4dd","bash_execution":"#b08968","compaction_summary":"#8b949e","branch_summary":"#c9d1d9"
};
const SOURCES = Object.keys(COLORS);
const FIXED = s => s.startsWith("system.") || s === "tool_description";
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtK = n => n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e3 ? (n/1e3).toFixed(n >= 1e5 ? 0 : 1)+"k" : String(Math.round(n));
const fmtCost = c => "$" + c.toFixed(c >= 10 ? 1 : 2);
const ago = ms => { const s = (Date.now()-ms)/1000; return s < 90 ? Math.round(s)+"s" : s < 5400 ? Math.round(s/60)+"m" : Math.round(s/3600)+"h"; };


const TOKEN = (document.querySelector('meta[name="attention-token"]') || {}).content || "";
const state = { att:null, path:null, series:null, sel:null, detail:null, open:new Set(), steer:new Set(), msg:{}, cleared:new Set(JSON.parse(localStorage.getItem("cleared") || "[]")) };
const STATUS = { working:"working", waiting:"waiting for you", idle:"idle" };
const fmtAge = d => d < 1 ? (d * 24 < 1 ? Math.max(1, Math.round(d * 1440)) + "m" : Math.round(d * 24) + "h") : d.toFixed(1) + "d";

async function api(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }
async function post(url, body) {
  const r = await fetch(url, { method:"POST", headers:{ "content-type":"application/json", "x-attention-token":TOKEN }, body:JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function refresh() {
  const att = await api("/api/attention?hours=24");
  if (att.focused) {
    for (const c of att.catches) if (c.sessionId === att.focused) state.cleared.add(c.key);
    localStorage.setItem("cleared", JSON.stringify([...state.cleared].slice(-500)));
  }
  state.att = att;
  renderSessions(); renderInbox();
}

function sessionRow(s, sub) {
  const d = document.createElement("div");
  d.className = "srow" + (state.att.focused === s.id ? " focus" : "");
  d.title = s.path;
  const toggle = !sub && s.subs.length ? `<span class="tg" data-t="1">${state.open.has(s.id) ? "▾" : "▸"} ${s.subs.length} sub</span>` : "";
  d.innerHTML = `<div class="p">${state.att.focused === s.id ? "● " : ""}${esc(sub ? (s.name || "sub-run") : s.project)}${toggle}</div>
    <div class="meta"><span class="st ${s.status}">${STATUS[s.status]}</span></div>
    <div class="nm">${esc(sub ? "" : (s.name || "(unnamed)"))}${s.orphan ? " · sub-run" : ""}</div>
    <div class="meta">${fmtAge(s.ageDays)} · ${fmtCost(s.cost)}</div>`;
  d.onclick = ev => {
    if (ev.target.dataset.t) { state.open.has(s.id) ? state.open.delete(s.id) : state.open.add(s.id); renderSessions(); return; }
    openDrill(s);
  };
  return d;
}

function renderSessions() {
  const el = $("slist"); el.innerHTML = "";
  const list = state.att.sessions;
  if (!list.length) { el.innerHTML = '<div id="empty">No session changed in the last 24 hours.</div>'; return; }
  for (const s of list) {
    el.appendChild(sessionRow(s, false));
    if (state.open.has(s.id) && s.subs.length) {
      const wrap = document.createElement("div"); wrap.className = "subs";
      for (const x of s.subs) wrap.appendChild(sessionRow(x, true));
      el.appendChild(wrap);
    }
  }
}

function isHot(c) { return state.att.focused !== c.sessionId && !c.verdict && !state.cleared.has(c.key); }

function outcomeText(o) {
  if (o.type === "esc") return `<b>Esc</b> then: ${esc(o.correction || "")}`;
  if (o.type === "steer") return `<b>Steered</b>: ${esc(o.correction || "")}`;
  return `<b>Rewind</b>: dropped ${o.requests} request${o.requests === 1 ? "" : "s"}, ${fmtK(o.droppedContextTokens || 0)} context tokens`;
}

function renderInbox() {
  const el = $("inbox"), a = state.att;
  const st = a.stats;
  $("stats").textContent = `${st.catches} catches · ${st.useful} useful · ${st.noise} noise · ${st.esc} esc · ${st.rewind} rewind`;
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
  el.innerHTML = "";
  if (!a.catches.length) { el.innerHTML = '<div id="nothing">Nothing to look at.</div>'; return; }
  for (const c of a.catches) {
    const d = document.createElement("div");
    d.className = "catch" + (isHot(c) ? " hot" : "");
    d.id = "c-" + c.key;
    const sav = c.saving ? `<div class="est">Estimate: ${fmtCost(c.saving.cost)} and ${fmtK(c.saving.tokens)} tokens of work after the assumption, before ${c.saving.via === "esc" ? "an Esc correction" : c.saving.via === "rewind" ? "a rewind" : "your steer"}.</div>` : "";
    const alts = c.alternatives.length ? `<div class="alts">Instead: ${c.alternatives.map(esc).join(" · ")}${c.basis ? ` — ${esc(c.basis)}` : ""}</div>` : (c.basis ? `<div class="alts">${esc(c.basis)}</div>` : "");
    const outs = a.outcomes.filter(o => o.catchKey === c.key).map(o => `<div class="out">${outcomeText(o)} <span>· ${ago(Date.parse(o.timestamp))} ago</span></div>`).join("");
    d.innerHTML = `<div class="who"><b>${esc(c.project)}</b><span>${esc(c.name || "")}</span><span class="badge ${c.kind}">${c.kind}</span><span style="margin-left:auto">${ago(Date.parse(c.timestamp))} ago</span></div>
      <div class="dec">${esc(c.decision)}</div>${alts}${sav}
      <div class="acts"><button data-a="steer">Steer</button><button data-a="mem">Save to memory</button>
        <button class="v ${c.verdict === "useful" ? "sel" : ""}" data-a="useful">Useful</button><button class="${c.verdict === "noise" ? "sel noise" : ""}" data-a="noise">Noise</button></div>
      <div class="steer ${state.steer.has(c.key) ? "open" : ""}"><textarea placeholder="Message to this session (Ctrl+Enter sends)"></textarea><button data-a="send">Send</button></div>
      <div class="msg">${esc(state.msg[c.key] || "")}</div>${outs}`;
    const ta = d.querySelector("textarea");
    const act = async a => {
      try {
        if (a === "steer") { state.steer.has(c.key) ? state.steer.delete(c.key) : state.steer.add(c.key); renderInbox(); const t = $("c-" + c.key).querySelector("textarea"); if (t) t.focus(); return; }
        if (a === "send") {
          if (!ta.value.trim()) return;
          await post("/api/steer", { sessionId: c.sessionId, text: ta.value }); state.steer.delete(c.key); state.msg[c.key] = "Sent.";
        } else if (a === "mem") { await post("/api/memory", { catchKey: c.key }); state.msg[c.key] = "Saved to work memory."; }
        else { await post("/api/verdict", { catchKey: c.key, verdict: a }); state.cleared.add(c.key); }
        await refresh();
      } catch (e) { state.msg[c.key] = "Failed: " + e.message; renderInbox(); }
    };
    d.querySelectorAll("button").forEach(b => b.onclick = () => act(b.dataset.a));
    ta.onkeydown = ev => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) act("send"); };
    el.appendChild(d);
  }
}

async function loadSession() {
  if (!state.path) return;
  const path = state.path;
  try {
    const series = await api("/api/session?path=" + encodeURIComponent(path));
    if (path !== state.path) return;
    state.series = series;
    if (state.sel !== null && state.sel >= series.points.length) state.sel = null;
    await loadDetail();
  } catch (e) { state.series = null; state.detail = null; }
  render();
}

async function loadDetail() {
  const n = state.series ? state.series.points.length : 0;
  if (!n) { state.detail = null; return; }
  const i = state.sel === null ? n - 1 : state.sel;
  try { state.detail = await api("/api/request?path=" + encodeURIComponent(state.path) + "&i=" + i); } catch { state.detail = null; }
}

async function select(i) { state.sel = i; await loadDetail(); render(); }

function openDrill(s) {
  state.path = s.path; state.sel = null; state.series = null; state.detail = null;
  $("drilltitle").textContent = s.project + (s.name ? " · " + s.name : "");
  $("drill").classList.add("open");
  loadSession();
}
function closeDrill() { $("drill").classList.remove("open"); state.path = null; }

function svg(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function tip(html, ev) {
  const t = $("tip");
  if (html === null) { t.style.display = "none"; return; }
  t.innerHTML = html; t.style.display = "block";
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.min(ev.clientX + 14, innerWidth - w - 8) + "px";
  t.style.top = Math.min(ev.clientY + 14, innerHeight - h - 8) + "px";
}

function renderChart() {
  const root = $("chart"); root.innerHTML = "";
  const box = $("chartbox").getBoundingClientRect();
  const W = Math.max(100, box.width - 16), H = Math.max(100, box.height - 16);
  root.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const pts = state.series ? state.series.points : [];
  const head = $("head");
  if (!pts.length) { head.textContent = "no requests yet"; return; }
  head.innerHTML = `<span>${esc(state.series.project)}${state.series.name ? " · " + esc(state.series.name) : ""}</span><span>${pts.length} requests · ${state.series.compactions.length} compactions</span>`;
  const L = 52, B = 22, T = 30, R = 8;
  const pw = W - L - R, ph = H - T - B;
  const max = Math.max(...pts.map(p => p.contextTokens), 1) * 1.05;
  const x = i => L + (pts.length === 1 ? pw / 2 : (i / (pts.length - 1)) * pw);
  const y = v => T + ph - (v / max) * ph;
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    svg("line", { x1:L, x2:W-R, y1:y(v), y2:y(v), stroke:"#2a313c" }, root);
    const t = svg("text", { x:L-6, y:y(v)+4, fill:"#8b949e", "font-size":12, "text-anchor":"end" }, root); t.textContent = fmtK(v);
  }
  const tokens = pts.map(p => { const o = {}; for (const s of SOURCES) o[s] = p.totalChars ? (p.chars[s] || 0) / p.totalChars * p.contextTokens : 0; return o; });
  const base = pts.map(() => 0);
  for (const s of SOURCES) {
    if (!pts.some((p, i) => tokens[i][s] > 0)) continue;
    const top = pts.map((_, i) => base[i] + tokens[i][s]);
    let d = pts.map((_, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(top[i]).toFixed(1)).join("");
    d += pts.map((_, i) => "L" + x(pts.length - 1 - i).toFixed(1) + " " + y(base[pts.length - 1 - i]).toFixed(1)).join("") + "Z";
    svg("path", { d, fill:COLORS[s], "fill-opacity":.85 }, root);
    for (let i = 0; i < pts.length; i++) base[i] = top[i];
  }
  let lastLabel = -Infinity;
  for (const c of state.series.compactions) {
    svg("line", { x1:x(c), x2:x(c), y1:T, y2:T+ph, stroke:"#fff", "stroke-dasharray":"4 4", "stroke-width":1.5 }, root);
    // Label only when it can't collide with the previous one; the dashed line alone marks the rest.
    if (x(c) - lastLabel < 90) continue;
    const t = svg("text", { x:x(c)+4, y:T+12, fill:"#fff", "font-size":12 }, root); t.textContent = "compaction";
    lastLabel = x(c);
  }
  const cur = state.sel === null ? pts.length - 1 : state.sel;
  svg("line", { x1:x(cur), x2:x(cur), y1:T, y2:T+ph, stroke:"#58a6ff", "stroke-width":2 }, root);
  const hover = svg("line", { y1:T, y2:T+ph, stroke:"#fff8", display:"none" }, root);
  const overlay = svg("rect", { x:L, y:T, width:pw, height:ph, fill:"transparent", style:"cursor:crosshair" }, root);
  const at = ev => {
    const r = root.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width) - L;
    return Math.max(0, Math.min(pts.length - 1, Math.round(px / pw * (pts.length - 1))));
  };
  overlay.onmousemove = ev => {
    const i = at(ev), p = pts[i];
    hover.setAttribute("x1", x(i)); hover.setAttribute("x2", x(i)); hover.removeAttribute("display");
    const turn = state.series.turns.find(t => t.turnIndex === p.turnIndex);
    const rows = SOURCES.filter(s => tokens[i][s] >= 1).sort((a, b) => tokens[i][b] - tokens[i][a])
      .map(s => `<div><i class="sw" style="background:${COLORS[s]}"></i>${s}: <b>${fmtK(tokens[i][s])}</b></div>`).join("");
    tip(`<b>request ${p.requestIndex}</b> · turn ${p.turnIndex} · ${fmtK(p.contextTokens)} tokens<br>${esc(p.model)}${rows}${turn && turn.userText ? `<div style="margin-top:6px;color:#8b949e">${esc(turn.userText)}</div>` : ""}`, ev);
  };
  overlay.onmouseleave = () => { hover.setAttribute("display", "none"); tip(null); };
  overlay.onclick = ev => select(at(ev));
}

function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, i) => s + i.chars, 0);
  if (total <= 0) return out;
  const scale = (w * h) / total;
  let rest = items.map(it => ({ it, a: it.chars * scale }));
  while (rest.length) {
    const side = Math.min(w, h);
    const worst = (sum, mx, mn) => Math.max(side * side * mx / (sum * sum), sum * sum / (side * side * mn));
    let n = 0, sum = 0, mx = 0, mn = Infinity, best = Infinity;
    while (n < rest.length) {
      const a = rest[n].a, s2 = sum + a, mx2 = Math.max(mx, a), mn2 = Math.min(mn, a);
      const wv = worst(s2, mx2, mn2);
      if (n > 0 && wv > best) break;
      sum = s2; mx = mx2; mn = mn2; best = wv; n++;
    }
    const row = rest.splice(0, n);
    if (w >= h) {
      const rw = sum / h; let cy = y;
      for (const r of row) { const rh = r.a / rw; out.push({ it: r.it, x, y: cy, w: rw, h: rh }); cy += rh; }
      x += rw; w -= rw;
    } else {
      const rh = sum / w; let cx = x;
      for (const r of row) { const rw = r.a / rh; out.push({ it: r.it, x: cx, y, w: rw, h: rh }); cx += rw; }
      y += rh; h -= rh;
    }
  }
  return out;
}

function renderTree() {
  const root = $("tree"); root.innerHTML = "";
  const box = $("treebox").getBoundingClientRect();
  const W = Math.max(100, box.width - 16), H = Math.max(100, box.height - 16);
  root.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const d = state.detail;
  if (!d) return;
  const segs = d.segments.filter(s => s.chars > 0).sort((a, b) => b.chars - a.chars);
  for (const r of squarify(segs, 0, 0, W, H)) {
    if (r.w < 1 || r.h < 1) continue;
    const s = r.it;
    const g = svg("g", {}, root);
    svg("rect", { x:r.x, y:r.y, width:r.w, height:r.h, fill:COLORS[s.source] || "#666", stroke:"#0e1116", "stroke-width":1.5 }, g);
    if (r.w > 70 && r.h > 30) {
      const t = svg("text", { x:r.x+6, y:r.y+17, fill:"#0e1116", "font-size":13, "font-weight":600 }, g);
      const label = s.label || s.source;
      const max = Math.floor((r.w - 12) / 7.5);
      t.textContent = label.length > max ? label.slice(0, Math.max(1, max - 1)) + "…" : label;
      if (r.h > 48) { const t2 = svg("text", { x:r.x+6, y:r.y+33, fill:"#0e1116", "font-size":12 }, g); t2.textContent = fmtK(s.tokens) + " tok"; }
    }
    g.onmousemove = ev => tip(`<i class="sw" style="background:${COLORS[s.source]}"></i><b>${s.source}</b>${s.label ? " · " + esc(s.label) : ""}<br>${s.chars.toLocaleString()} chars · ~${s.tokens.toLocaleString()} tokens<br>age ${s.ageTurns} turns · position ${s.position}`, ev);
    g.onmouseleave = () => tip(null);
  }
}

function renderRight() {
  const d = state.detail, nums = $("nums"), top = $("top");
  nums.innerHTML = ""; top.innerHTML = "";
  if (!d) return;
  let fixed = 0;
  for (const g of d.bySource) if (FIXED(g.source)) fixed += g.chars;
  const share = d.totalChars ? fixed / d.totalChars : 0;
  const cost = state.series.points.slice(0, d.requestIndex + 1).reduce((s, p) => s + p.cost, 0);
  const cells = [["context tokens", fmtK(d.contextTokens)], ["cost so far", fmtCost(cost)], ["fixed share", (share * 100).toFixed(0) + "%"], ["conversation", ((1 - share) * 100).toFixed(0) + "%"],
    ["request", "#" + d.requestIndex], ["turn", d.turnIndex]];
  for (const [k, v] of cells) nums.insertAdjacentHTML("beforeend", `<div class="num"><div class="v">${v}</div><div class="k">${k}</div></div>`);
  for (const s of [...d.segments].sort((a, b) => b.chars - a.chars).slice(0, 10)) {
    top.insertAdjacentHTML("beforeend", `<div class="seg"><i class="sw" style="background:${COLORS[s.source]}"></i><span class="n" title="${esc(s.source)}">${esc(s.label || s.source)}</span><span class="v">${fmtK(s.tokens)}</span></div>`);
  }
}

function renderLegend() {
  $("legend").innerHTML = SOURCES.map(s => `<span><i class="sw" style="background:${COLORS[s]}"></i>${s}</span>`).join("");
}

function render() { renderChart(); renderTree(); renderRight(); }


$("close").onclick = closeDrill;
addEventListener("keydown", ev => { if (ev.key === "Escape" && $("drill").classList.contains("open")) closeDrill(); });
addEventListener("resize", () => { if (state.path) render(); });
renderLegend();

function connect() {
  const es = new EventSource("/events");
  const boot = (document.querySelector('meta[name="attention-boot"]') || {}).content || "";
  // The server restarted (pi start brings it back): reload to pick up its new POST token.
  es.addEventListener("boot", ev => { if (boot && ev.data !== boot) location.reload(); });
  es.onmessage = async ev => {
    const { path } = JSON.parse(ev.data);
    await refresh().catch(() => {});
    if (path && path === state.path) await loadSession();
  };
}
refresh().catch(() => {}).then(connect);
setInterval(() => refresh().catch(() => {}), 15000);
</script>
