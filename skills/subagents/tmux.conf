# tmux config for the pi-sub server (`tmux -L pi-sub`), and only that server.
#
# `sub` passes this with -f when it starts the server, and re-sources it on
# every `sub open` so a server started before a change here picks it up too.
# Your own tmux servers never see it.

# Your settings first, so the lines below win where they overlap.
source-file -q ~/.tmux.conf

# An attached child is a tmux pane, so the terminal's own scrollback can't see
# it. With the mouse on, the scroll wheel enters tmux copy-mode and scrolls the
# pane's history. q or Escape leaves copy-mode.
set -g mouse on

# tmux keeps 2000 lines by default, a few minutes of agent output. This only
# applies to panes created after it is set: children already running keep
# the limit they started with.
set -g history-limit 50000
